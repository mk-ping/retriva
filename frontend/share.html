<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retriva - Shared knowledge base</title>
<link rel="stylesheet" href="css/tokens.css" />
<style>
  .sh { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-5); display: flex; flex-direction: column; min-height: 100vh; }
  .sh h1 { font-size: var(--text-2xl); margin-bottom: var(--space-1); }
  .sh-note { font-size: var(--text-xs); color: var(--ink-3); margin-bottom: var(--space-5); }
  #log { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); padding-bottom: var(--space-5); }
  .b { padding: var(--space-4); border-radius: var(--radius-lg); font-size: var(--text-sm); line-height: 1.7; max-width: 90%; }
  .b.user { align-self: flex-end; background: var(--ink); color: var(--bg); white-space: pre-wrap; }
  .b.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .b p { color: inherit; margin-bottom: var(--space-2); }
  .b ul, .b ol { margin: var(--space-2) 0 var(--space-2) var(--space-5); }
  .b pre { background: rgba(0,0,0,0.06); padding: var(--space-3); border-radius: var(--radius-md); overflow-x: auto; }
  .b details { margin-top: var(--space-3); }
  .b summary { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--ink-2); cursor: pointer; }
  .src-l { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--sage-deep); margin-top: var(--space-3); }
  .src-t { font-size: var(--text-xs); color: var(--ink-2); white-space: pre-wrap; }
  .bar { display: flex; gap: var(--space-3); position: sticky; bottom: 0; background: var(--bg); padding: var(--space-3) 0; }
  .bar input { flex: 1; padding: 11px 13px; border: 1px solid var(--line-2); border-radius: var(--radius-md); background: var(--surface); outline: none; }
  .bar input:focus { border-color: var(--sage-deep); }
</style>
</head>
<body>
<div class="sh">
  <a class="wordmark" href="index.html">Retriva</a>
  <h1 id="title">Loading...</h1>
  <p id="desc"></p>
  <p class="sh-note">Shared read-only. Answers come from this knowledge base's documents and can be wrong, so check the sources. Your questions are not saved.</p>
  <div id="log"></div>
  <form class="bar" id="form">
    <input id="q" maxlength="500" placeholder="Ask a question..." autocomplete="off" />
    <button class="btn btn-primary" id="send" type="submit">Ask</button>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="config.js"></script>
<script src="js/share.js"></script>
</body>
</html>
