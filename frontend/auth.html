<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retriva — Sign in</title>
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-wordmark">
      <a href="index.html" class="wordmark">Retriva</a>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
        <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form class="auth-form active" id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="login-submit">Sign in</button>
      </form>

      <form class="auth-form" id="form-signup">
        <div class="field">
          <label for="signup-name">Full name</label>
          <input type="text" id="signup-name" required autocomplete="name" />
          <span class="field-error" id="signup-name-err">Name must be at least 2 characters.</span>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required autocomplete="new-password" />
          <span class="field-error" id="signup-password-err">Password must be at least 8 characters.</span>
        </div>
        <button type="submit" class="btn btn-primary auth-submit" id="signup-submit">Create account</button>
      </form>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
